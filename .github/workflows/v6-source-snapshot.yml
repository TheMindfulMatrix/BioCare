name: V6 source snapshot

on:
  push:
    branches: [agent/v6-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload branch source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: biocare-v6-source
          path: |
            .
            !.git/
          include-hidden-files: true
          retention-days: 1
