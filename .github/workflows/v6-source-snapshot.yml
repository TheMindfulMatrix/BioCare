name: V6 approved core build

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply, validate, and record result
        shell: bash
        run: |
          set +e
          LOG=/tmp/v6-apply.log
          : > "$LOG"
          {
            cat reports/v6/patch/core.part* | base64 --decode | gzip --decompress > /tmp/v6-core.patch
            echo "ed53a2a5549ecf2629b5566f9b7e31f2cbe93e903f5ffd2bf0b6ebfc9d30ef36  /tmp/v6-core.patch" | sha256sum --check
            patch -p1 --forward < /tmp/v6-core.patch
            python scripts/build.py
            python scripts/validate.py
            python scripts/validate.py --compliance-strict --compliance-dry-run
            python -m unittest discover -s tests -v
            git diff --check
          } 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}

          git config user.name "BioCare V6 Builder"
          git config user.email "gherbonzt3@outlook.com"

          if [ "$STATUS" -eq 0 ]; then
            git restore --source=HEAD -- .github/workflows/validate.yml
            rm -rf reports/v6/patch
            rm -f reports/v6/latest_source_run.txt
            rm -f reports/v6/latest_apply_run.txt reports/v6/latest_apply_status.txt reports/v6/latest_apply_log.txt
            cat > reports/v6/BUILD_STATUS.md <<'EOF'
          # The Mindful Matrix V6 build status

          - Baseline: `b5d35772e98580e253c08f6319aa8e412fa20aea` (V5.1)
          - Branch: `agent/v6-build`
          - Phase A: approved
          - Core V6 architecture: implemented and validated
          - CI workflow hardening: pending connector-authored checkpoint
          - Image normalization: pending user visual approval; V5.1 images remain active
          - Ingredient dataset: pending user factual approval; no unapproved data renders
          - Policy language: pending current-source verification and user approval
          - How It Works imagery: deferred until licensed assets are supplied
          - Production: unchanged
          - Merge/deployment: prohibited until separate approval
          EOF
            git add -A
            git commit -m "v6: implement catalog, attribution, and accessibility foundation"
          else
            git reset --hard HEAD
            mkdir -p reports/v6
            printf '%s\n' "$GITHUB_RUN_ID" > reports/v6/latest_apply_run.txt
            printf 'FAILED (%s)\n' "$STATUS" > reports/v6/latest_apply_status.txt
            tail -n 160 "$LOG" > reports/v6/latest_apply_log.txt
            git add reports/v6/latest_apply_run.txt reports/v6/latest_apply_status.txt reports/v6/latest_apply_log.txt
            git commit -m "chore(v6): record failed core build run"
          fi
          git push origin HEAD:agent/v6-build
          exit "$STATUS"
