name: V6 authoritative final finish pass

on:
  push:
    branches: [agent/v6-build]

permissions:
  contents: write
  pull-requests: write

env:
  REVIEW_DIR: /tmp/v6-finish-review
  BASELINE: b5d35772e98580e253c08f6319aa8e412fa20aea

jobs:
  finish:
    if: ${{ contains(github.event.head_commit.message, '[run v6-finish-pass]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Apply evidence-safe finish-pass changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          import json,re,math,statistics,shutil,hashlib,html
          ROOT=Path('.'); REVIEW=Path('/tmp/v6-finish-review'); REVIEW.mkdir(parents=True,exist_ok=True)
          DATE='2026-08-20'
          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def write(p,o): Path(p).parent.mkdir(parents=True,exist_ok=True);Path(p).write_text(json.dumps(o,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          def psnr(a,b):
            a=a.convert('RGB');b=b.convert('RGB')
            if a.size!=b.size:b=b.resize(a.size,Image.Resampling.LANCZOS)
            aa=list(a.getdata());bb=list(b.getdata());m=sum(sum((x-y)**2 for x,y in zip(p,q)) for p,q in zip(aa,bb))/(len(aa)*3)
            return 99 if m<=0 else 10*math.log10(255*255/m)
          def comp(im,bg):
            x=Image.new('RGBA',im.size,bg);x.alpha_composite(im.convert('RGBA'));return x.convert('RGB')
          catalog=load('content/catalog.json'); active=[p for p in catalog['products'] if p.get('commercial_status','active')=='active']
          source=[]
          for p in active:
            rel=p['cutout']['src'];fp=ROOT/rel
