                  if isinstance(v,bool) and pp and 'untouched' in k.lower():o[k]=False
                  elif isinstance(v,(dict,list)):patch(v,pp)
              elif isinstance(o,list):
                for v in o:patch(v,prov)
            patch(p['cutout'])
            p['cutout']['v6FinishOptimization']={'status':'approved-finish-pass','activePath':row['rel'],'method':f'no-upscale WebP, max dimension {chosen["dim"]}px, quality {chosen["quality"]}','checkedDate':DATE,'beforeBytes':row['before'],'afterBytes':row['after'],'psnrMinimumCompositeDb':row['psnr']}
            if p['manufacturer']=='Zinzino':bz+=row['before'];az+=row['after']
            else:bb+=row['before'];ab+=row['after']
          write('content/catalog.json',catalog)
          image_report={'checked_date':DATE,'selected_config':{'max_dim':chosen['dim'],'quality':chosen['quality']},'target_bytes':800000,'target_met':True,'zinzino_before_bytes':bz,'zinzino_after_bytes':az,'biolimitless_before_bytes':bb,'biolimitless_after_bytes':ab,'total_after_bytes':az+ab,'reduction_from_previous_candidate_percent':round((1405208-(az+ab))*100/1405208,2),'minimum_psnr_db':round(chosen['minimum_psnr'],2),'mean_psnr_db':round(chosen['mean_psnr'],2),'largest_remaining':sorted(chosen['rows'],key=lambda x:x['after'],reverse=True)[:10],'items':chosen['rows']}
          write('reports/v6/finish-image-optimization.json',image_report)
          top=sorted(chosen['rows'],key=lambda x:(x['before']-x['after'])/max(x['before'],1),reverse=True)[:5];tiles=[]
          for row in top:
            old=next(im for p,rel,fp,im in source if p['id']==row['id']).convert('RGBA');new=Image.open(ROOT/row['rel']).convert('RGBA')
            tile=Image.new('RGB',(1100,500),'#efe7da');dr=ImageDraw.Draw(tile);font=ImageFont.load_default();dr.text((18,12),row['name'],fill='#151814',font=font);dr.text((18,32),f'Before {row["before"]:,} B',fill='#33463b',font=font);dr.text((570,32),f'After {row["after"]:,} B · PSNR {row["psnr"]} dB',fill='#33463b',font=font)
            for x,im in ((18,old),(570,new)):
              bg=Image.new('RGBA',(510,420),(15,24,18,255));cp=im.copy();cp.thumbnail((470,380),Image.Resampling.LANCZOS);bg.alpha_composite(cp,((510-cp.width)//2,(420-cp.height)//2));tile.paste(bg.convert('RGB'),(x,62))
            tiles.append(tile)
          sheet=Image.new('RGB',(1100,500*len(tiles)),'#efe7da')
          for i,t in enumerate(tiles):sheet.paste(t,(0,i*500))
          sheet.save(REVIEW/'finish-image-top5-contact-sheet.jpg','JPEG',quality=90)
          old=ROOT/'assets/artwork/shelf/balance-test-basic-kit-cinematic.webp';new=ROOT/'assets/artwork/shelf/balance-test-basic-kit-cinematic-v6.webp'
          with Image.open(old) as im:
            src=im.convert('RGB');h=round(src.width/(4/5));cy=src.height*.53;top=max(0,min(src.height-h,round(cy-h/2)));crop=src.crop((0,top,src.width,top+h)).resize((800,1000),Image.Resampling.LANCZOS);crop.save(new,'WEBP',quality=78,method=6)
          for rel in ('templates/index.html','index.html','content/site.json'):
            p=ROOT/rel
            if p.exists():
