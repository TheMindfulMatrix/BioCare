          write('reports/v6/hero-ratio-audit.json',{'source':str(old),'source_dimensions':[1024,1536],'source_bytes':old.stat().st_size,'final':str(new),'final_dimensions':[800,1000],'final_bytes':new.stat().st_size,'source_aspect':round(1024/1536,4),'final_aspect':.8,'display_aspect':.8,'checked_date':DATE})
          labels=load('content/product-labels.json');records=labels if isinstance(labels,list) else next((labels[k] for k in ('products','labels','records','productLabels','product_labels') if isinstance(labels.get(k),list)),[]);lmap={(r.get('productId') or r.get('product_id') or r.get('id')):r for r in records}
          def surl(r):return (r or {}).get('sourceUrl') or (r or {}).get('source_url') or (((r or {}).get('source') or {}).get('url') if isinstance((r or {}).get('source'),dict) else None)
          docs={'schemaVersion':2,'checkedDate':DATE,'scope':'Public manufacturer documentation reviewed for the active US catalog.','manufacturers':{'Zinzino':{'summary':'Official product sheets are linked when a product-specific document was verified.','generalDocuments':[{'title':'Zinzino US Customer Service and official terms links','url':'https://www.zinzino.com/site/us/en-us/about/customer-service'}],'coaStatement':f'No public per-lot Certificate of Analysis was located in the official Zinzino materials reviewed on {DATE}.'},'BioLimitless':{'summary':'Official product pages or fact documents are linked only where they could be verified.','generalDocuments':[{'title':'BioLimitless official product catalog','url':'https://biolimitless.com/shop/'}],'coaStatement':f'No public per-lot Certificate of Analysis was located in the official BioLimitless materials reviewed on {DATE}.'}},'products':{}}
          for p in active:
            u=surl(lmap.get(p['id']));docs['products'][p['id']]={'manufacturer':p['manufacturer'],'sku':p.get('sku'),'checkedDate':DATE,'productSpecificDocument':{'title':'Official manufacturer product or label source','url':u} if u else None,'availabilityStatement':'A product-specific official source was verified and is linked below.' if u else 'No product-specific public label or testing document was verified for this record in the V6 evidence set.'}
          write('content/manufacturer-documents.json',docs)
          helper='''#!/usr/bin/env python3\nfrom pathlib import Path\nimport json,html\nROOT=Path(__file__).resolve().parents[1]\ndef e(x):return html.escape(str(x),quote=True)\ndef apply_finish_pass():\n c=json.loads((ROOT/"content/catalog.json").read_text());d=json.loads((ROOT/"content/manufacturer-documents.json").read_text());active=[p for p in c["products"] if p.get("commercial_status","active")=="active"];count=str(len(active))\n for page in [ROOT/"index.html",ROOT/"shop.html",ROOT/"library.html",ROOT/"start.html"]+sorted((ROOT/"library").glob("*.html")):\n  if not page.exists():continue\n  text=page.read_text().replace("__ACTIVE_PRODUCT_COUNT__",count)\n  if page.name=="shop.html":\n   for p in active:\n    marker=f'id="product-{p["id"]}"';pos=text.find(marker)\n    if pos<0:continue\n    end=text.find("</article>",pos);card=text[pos:end]\n    if end<0 or "data-manufacturer-transparency" in card:continue\n    md=d["manufacturers"][p["manufacturer"]];pd=d["products"][p["id"]];links=[]\n    if pd.get("productSpecificDocument"):x=pd["productSpecificDocument"];links.append(f'<li><a href="{e(x["url"])}" target="_blank" rel="noopener noreferrer" aria-label="{e(x["title"])} for {e(p["name"])} (opens in a new tab)">{e(x["title"])} ↗</a></li>')\n    x=md["generalDocuments"][0];links.append(f'<li><a href="{e(x["url"])}" target="_blank" rel="noopener noreferrer">{e(x["title"])} ↗</a></li>')\n    block=f'<details class="manufacturer-transparency" data-manufacturer-transparency><summary>What the manufacturer publishes</summary><div class="manufacturer-transparency__body"><p><strong>{e(p["manufacturer"])}</strong></p><p>{e(pd["availabilityStatement"])}</p><ul>{"".join(links)}</ul><p class="manufacturer-transparency__gap">{e(md["coaStatement"])}</p><small>Documentation checked {e(d["checkedDate"])}. The manufacturer source controls.</small></div></details>'\n    text=text[:end]+block+text[end:]\n  page.write_text(text)\nif __name__=="__main__":apply_finish_pass()\n'''
          Path('scripts/v6_finish_transform.py').write_text(helper)
          bp=Path('scripts/build.py');bt=bp.read_text();hook='\n# V6 finish-pass deterministic post-processing.\nif __name__ == "__main__":\n    from v6_finish_transform import apply_finish_pass\n    apply_finish_pass()\n'
          if 'from v6_finish_transform import apply_finish_pass' not in bt:bp.write_text(bt.rstrip()+hook+'\n')
          css=Path('assets/css/site.css');ct=css.read_text();block='''\n/* V6 finish pass: transparency and mobile minimums. */\n.manufacturer-transparency{margin-top:var(--space-4);border-top:1px solid var(--section-border);padding-top:var(--space-3)}\n.manufacturer-transparency summary{min-height:var(--touch-target);display:flex;align-items:center;cursor:pointer;color:var(--section-green);font:650 .75rem/1.35 var(--font-data);letter-spacing:.055em;text-transform:uppercase}\n.manufacturer-transparency__body{display:grid;gap:.65rem;padding:.25rem 0 var(--space-3);color:var(--section-text-muted);font-size:.78rem}.manufacturer-transparency__body p{margin:0}.manufacturer-transparency__body ul{display:grid;gap:.45rem;margin:0;padding:0;list-style:none}.manufacturer-transparency__body a{min-height:var(--touch-target);display:inline-flex;align-items:center;color:var(--section-green)}.manufacturer-transparency__gap{padding-left:.75rem;border-left:2px solid var(--section-gold)}\n@media(max-width:48rem){.hero-context a{min-height:44px;display:inline-flex;align-items:center;padding-block:.8rem}.section-kicker,.interface-label,.hero-context,.hero-context span,.hero-context a,.hero-affiliate-note,.hero-product__signal,.hero-product__caption span,.hero-product__caption small,.hero-data,.hero-status,.product-universe__intent span,.product-universe__intent small,.shop-intent-nav span,.shop-intent-nav small,.shop-hero__status small,.shop-product__index,.shop-product__sku,.product-price__item,.product-price__item strong,.product-price__source,.product-meta dt,.product-meta dd,.shop-product .button,.shop-product .button-tertiary,.manufacturer-transparency summary,.manufacturer-transparency__body,.manufacturer-transparency__body small{font-size:.75rem!important}}\n'''
          if 'V6 finish pass: transparency and mobile minimums' not in ct:css.write_text(ct.rstrip()+'\n'+block)
          Path('reports/v6/structured-data-decision.md').write_text('''# T4.3 structured-data decision\n\n**PATH B — retain CollectionPage + ItemList.** The Shop is a multi-product editorial affiliate collection, not 45 canonical single-product purchase pages. It does not own checkout, inventory, fulfillment, shipping, returns, or manufacturer availability. V6 therefore omits Product, Offer, availability, aggregateRating, review, seller, and merchant-listing claims. Product markup becomes appropriate only after canonical product-focused pages exist and every visible fact can be maintained. Official guidance: https://developers.google.com/search/docs/appearance/structured-data/product ; https://developers.google.com/search/docs/appearance/structured-data/product-snippet ; https://developers.google.com/search/docs/appearance/structured-data/merchant-listing ; https://developers.google.com/search/docs/appearance/structured-data/carousel\n''')
          cov=load('reports/v6/ingredient-coverage.json');items=cov.get('items',[]);mapped=[]
          for x in items:
            s=x.get('status');b='none' if s=='complete_verified' else ('official source verifies some facts but not a complete per-serving label' if s=='partial_verified' else ('official BioLimitless numerical label document not reliably available' if x.get('manufacturer')=='BioLimitless' else 'exact current SKU-specific Zinzino US label not verified'))
            mapped.append({**x,'blocker':b})
          write('reports/v6/ingredient-outcome.json',{'checked_date':DATE,'active_products':45,'complete_verified':sum(x.get('status')=='complete_verified' for x in mapped),'partial_verified':sum(x.get('status')=='partial_verified' for x in mapped),'unavailable_or_unverified':45-sum(x.get('status') in ('complete_verified','partial_verified') for x in mapped),'assessment':'Coverage remains limited: only three complete and one partial verified label record out of 45 active products. The evidence method is sound, but the broader full-label trust goal is not complete.','products':mapped})
