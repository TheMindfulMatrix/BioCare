          configs=[(640,72),(600,70),(560,68),(520,66),(500,64),(480,62)]
          trials=[]; trial_root=Path('/tmp/v6-image-trials');shutil.rmtree(trial_root,ignore_errors=True);trial_root.mkdir()
          for dim,q in configs:
            d=trial_root/f'{dim}-{q}';d.mkdir();rows=[];total=0;scores=[]
            for p,rel,fp,im in source:
              scale=min(1,dim/max(im.size));size=(max(1,round(im.width*scale)),max(1,round(im.height*scale)))
              outim=im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
              if size!=im.size:outim=outim.resize(size,Image.Resampling.LANCZOS)
              out=d/(Path(rel).stem+'.webp');outim.save(out,'WEBP',quality=q,method=6,exact=True)
              dec=Image.open(out).convert('RGBA');src=im.convert('RGBA').resize(size,Image.Resampling.LANCZOS)
              score=min(psnr(comp(src,(15,24,18,255)),comp(dec,(15,24,18,255))),psnr(comp(src,(244,239,228,255)),comp(dec,(244,239,228,255))))
              total+=out.stat().st_size;scores.append(score);rows.append({'id':p['id'],'name':p['name'],'manufacturer':p['manufacturer'],'rel':rel,'before':fp.stat().st_size,'after':out.stat().st_size,'dimensions':list(size),'trial':str(out),'psnr':round(score,2)})
            trials.append({'dim':dim,'quality':q,'total':total,'minimum_psnr':min(scores),'mean_psnr':statistics.mean(scores),'rows':rows})
