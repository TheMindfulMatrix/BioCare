name: V6 finish-pass cleanup

on:
  push:
    branches: [agent/v6-build]

permissions:
  contents: write

env:
  BASELINE: b5d35772e98580e253c08f6319aa8e412fa20aea

jobs:
  cleanup:
    if: ${{ contains(github.event.head_commit.message, '[run v6-cleanup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for authoritative finish-pass candidate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            git fetch origin agent/v6-build main
            git reset --hard origin/agent/v6-build
            if test -f reports/v6/FINAL_STATUS.txt && grep -qx 'V6 CANDIDATE READY FOR FINAL USER REVIEW' reports/v6/FINAL_STATUS.txt && test -f reports/v6/FINAL_FINISH_PASS.json; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              echo 'Authoritative finish-pass report was not ready.' >&2
              exit 1
            fi
            sleep 20
          done
          test "$(git rev-parse origin/main)" = "$BASELINE"
      - name: Re-run permanent validation before cleanup
        shell: bash
        run: |
          set -o pipefail
          python scripts/build.py
          python scripts/validate.py
          python scripts/validate.py --compliance-strict --compliance-dry-run
          python -m unittest discover -s tests -v
          git diff --check
      - name: Remove temporary execution assets and record cleanup
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(git rev-parse HEAD)
          rm -f .github/workflows/v6-finish-source-snapshot.yml .github/workflows/v6-finish-cleanup.yml
          rm -rf reports/v6/final-transfer
          mkdir -p reports/v6
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          baseline='b5d35772e98580e253c08f6319aa8e412fa20aea'
          branches=['agent/v6-finish-safety','agent/v6-finish-safety-backup','agent/v6-finish-cleanup-temp','agent/v6-finish-cleanup-temp2','agent/v6-finish-cleanup-temp3']
          report={'checked_date':'2026-08-20','branch':'agent/v6-build','main':subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip(),'baseline':baseline,'temporary_workflows_removed':['.github/workflows/v6-finish-source-snapshot.yml','.github/workflows/v6-finish-cleanup.yml'],'temporary_transfer_removed':not Path('reports/v6/final-transfer').exists(),'temporary_branches_requested_for_deletion':branches,'permanent_validation_before_cleanup':'passed'}
          Path('reports/v6/FINAL_CLEANUP.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          git add -A
          git config user.name 'BioCare V6 Builder'
          git config user.email 'gherbonzt3@outlook.com'
          git commit -m 'chore(v6): remove finish-pass execution artifacts [skip v6-finish-pass] [skip v6-cleanup]'
          git push origin HEAD:agent/v6-build
          for branch in agent/v6-finish-safety agent/v6-finish-safety-backup agent/v6-finish-cleanup-temp agent/v6-finish-cleanup-temp2 agent/v6-finish-cleanup-temp3; do
            git push origin --delete "$branch" || true
          done
