name: Daily site audit

on:
  workflow_dispatch:
  schedule:
    # One local-time schedule follows America/Chicago across CST and CDT.
    - cron: "0 8 * * *"
      timezone: "America/Chicago"

permissions:
  contents: read
  actions: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative default branch snapshot
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record audited SHA
        shell: bash
        run: echo "AUDITED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build and validate repository snapshot
        run: |
          python scripts/build.py
          git diff --exit-code -- index.html core-four.html explore.html evidence.html shop.html library.html start.html know-your-number.html about.html privacy.html departments/ library/ products/ assets/data/search-index.json robots.txt sitemap.xml
          python scripts/validate.py
          python scripts/validate.py --compliance-strict --compliance-dry-run
          python -m unittest discover -s tests -v
          node --test tests/measurement.test.cjs
          python scripts/asset_inventory.py --output outputs/daily-audit/asset-inventory.json
          python scripts/triage_compliance.py --json-output outputs/daily-audit/compliance-triage.json --markdown-output outputs/daily-audit/compliance-triage.md

      - name: Audit live production parity
        run: python scripts/daily_audit.py --root . --base-url https://themindfulmatrixhealth.com/ --audited-sha "$AUDITED_SHA" --output outputs/daily-audit/site-audit.json

      - name: Install browser audit runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Responsive browser audit
        run: python scripts/browser_audit.py --root . --base-url https://themindfulmatrixhealth.com/ --output-dir outputs/daily-audit/browser

      - name: Write next-actions summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Daily Mindful Matrix audit"
            echo
            echo "Audited repository SHA: \`${AUDITED_SHA:-unavailable}\`"
            echo
            echo "### Next actions"
            echo "1. Address confirmed regressions before optional improvements."
            echo "2. Review the current compliance triage queue."
            echo "3. Review asset-inventory orphan candidates before removal."
            echo
            echo "This workflow made no website, repository, issue, pull-request, merge, or deployment changes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-site-audit-${{ github.run_id }}
          path: outputs/daily-audit/
          if-no-files-found: warn
          retention-days: 30
