name: V6 final finish pass v2

on:
  push:
    branches: [agent/v6-build]

permissions:
  contents: write
  pull-requests: write

env:
  V6_REVIEW_DIR: /tmp/v6-finish-review
  BASELINE: b5d35772e98580e253c08f6319aa8e412fa20aea

jobs:
  finish:
    if: ${{ !contains(github.event.head_commit.message, '[skip v6-finish-pass]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-build
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify protected state and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$BASELINE"
          test "$(git branch --show-current)" = "agent/v6-build"
          python -m pip install --upgrade pip
          python -m pip install pillow beautifulsoup4 playwright pypdf lxml
          python -m playwright install --with-deps chromium
      - name: Assemble approved finish tooling
        shell: bash
        run: |
          cat reports/v6/finish-transfer/part00 reports/v6/finish-transfer/part01 reports/v6/finish-transfer/part02 reports/v6/finish-transfer/part03 > scripts/v6_finish_patch.py
          cp scripts/v6_finish_prepare_v2.py scripts/v6_finish_prepare.py
          chmod +x scripts/v6_finish_patch.py scripts/v6_finish_prepare.py scripts/v6_finish_browser_qa.py scripts/v6_finish_verify.py
          python -m py_compile scripts/v6_finish_patch.py scripts/v6_finish_prepare.py scripts/v6_finish_browser_qa.py scripts/v6_finish_verify.py
      - name: Verify V5.1 rollback tag
        shell: bash
        run: |
          set -euo pipefail
          target="$(git rev-list -n 1 v5.1 2>/dev/null || true)"
          test "$target" = "$BASELINE"
          mkdir -p reports/v6
          printf '{"name":"v5.1","target":"%s","verified":true}\n' "$target" > reports/v6/finish-tag-state.json
      - name: Apply source and asset finish pass
        shell: bash
        run: |
          set -o pipefail
          python scripts/v6_finish_patch.py | tee /tmp/v6-finish-patch.log
          python scripts/v6_finish_prepare.py | tee /tmp/v6-finish-images.log
          python scripts/build.py | tee /tmp/v6-finish-build.log
      - name: Verify all external URLs and static social transport
        run: python scripts/v6_finish_verify.py network
      - name: Run complete rendered QA
        run: python scripts/v6_finish_browser_qa.py
      - name: Consolidate Definition of Done and final evidence
        run: python scripts/v6_finish_verify.py report
      - name: Run permanent gates
        shell: bash
        run: |
          set -o pipefail
          python scripts/build.py
          python scripts/validate.py | tee /tmp/v6-finish-validate.log
          python scripts/validate.py --compliance-strict --compliance-dry-run | tee /tmp/v6-finish-strict.log
          python -m unittest discover -s tests -v
          git diff --check
          python scripts/build.py
          git diff --check
          grep -Fx 'V6 CANDIDATE READY FOR FINAL USER REVIEW' reports/v6/FINAL_STATUS.txt
      - name: Upload full finish-pass evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-final-finish-pass-review
          path: |
            /tmp/v6-finish-review/
            reports/v6/*.json
            reports/v6/*.md
            reports/v6/FINAL_STATUS.txt
            /tmp/v6-finish-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit final candidate and remove temporary execution files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v6-finish-pass.yml .github/workflows/v6-finish-pass-v2.yml .github/workflows/v6-finish-diagnostic.yml
          rm -rf reports/v6/finish-transfer
          rm -f scripts/v6_finish_patch.py scripts/v6_finish_prepare_v2.py
          git config user.name "BioCare V6 Builder"
          git config user.email "gherbonzt3@outlook.com"
          git add -A
          git diff --cached --check
          git commit -m "v6: complete final finish pass for user review [skip v6-finish-pass]"
          git push origin HEAD:agent/v6-build
      - name: Update existing draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '# The Mindful Matrix V6 — final finish-pass candidate'
            echo
            cat reports/v6/FINAL_FINISH_PASS.md
            echo
            echo '## Safety'
            echo
            echo '- PR remains DRAFT and unmerged.'
            echo '- `main` and production remain on V5.1.'
            echo '- A separate user-approved release command is required.'
          } > /tmp/v6-finish-pr.md
          gh pr edit 6 --title "V6 final finish-pass candidate — ready for user review" --body-file /tmp/v6-finish-pr.md
