name: V7 source snapshot

on:
  push:
    branches: [agent/v7-product-first]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    if: ${{ github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[run v7-source-snapshot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v7-product-first
          fetch-depth: 0
          fetch-tags: true
      - name: Record repository state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v7-source-snapshot
          git rev-parse HEAD > /tmp/v7-source-snapshot/HEAD.txt
          git rev-parse origin/main > /tmp/v7-source-snapshot/MAIN.txt
          git status --short > /tmp/v7-source-snapshot/STATUS.txt
          git tag --list --format='%(refname:short) %(objectname)' > /tmp/v7-source-snapshot/TAGS.txt
          tar --exclude=.git -czf /tmp/v7-source-snapshot/repository.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: v7-source-snapshot
          path: /tmp/v7-source-snapshot/
          if-no-files-found: error
          retention-days: 3
