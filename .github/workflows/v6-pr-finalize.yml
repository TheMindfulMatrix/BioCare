name: V6 PR finalization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  BASELINE: b5d35772e98580e253c08f6319aa8e412fa20aea
  REVIEW_DIR: /tmp/v6-pr-finalization

jobs:
  finalize:
    if: ${{ github.head_ref == 'agent/v6-build' && contains(github.event.pull_request.head.sha, '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-build
          fetch-depth: 0
          fetch-tags: true

      - name: Verify authorized trigger and protected state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$REVIEW_DIR"
          test "$(git branch --show-current)" = "agent/v6-build"
          test -z "$(git status --porcelain)"
          git fetch origin main agent/v6-build --tags
          test "$(git rev-parse origin/main)" = "$BASELINE"
          test "$(git merge-base origin/main HEAD)" = "$BASELINE"
          test "$(git rev-parse 'v5.1^{}')" = "$BASELINE"
          git log -1 --format=%B | grep -F '[run v6-pr-finalize]'
          gh pr view 6 --json state,isDraft,mergeable,mergedAt,headRefOid,baseRefOid,url > "$REVIEW_DIR/pr-before.json"
          test "$(jq -r .state "$REVIEW_DIR/pr-before.json")" = "OPEN"
          test "$(jq -r .isDraft "$REVIEW_DIR/pr-before.json")" = "true"
          test "$(jq -r .mergedAt "$REVIEW_DIR/pr-before.json")" = "null"
          test "$(jq -r .headRefOid "$REVIEW_DIR/pr-before.json")" = "$(git rev-parse HEAD)"
          test "$(jq -r .baseRefOid "$REVIEW_DIR/pr-before.json")" = "$BASELINE"
          git ls-remote --heads origin 'refs/heads/agent/v6-finish-*' | awk '{print $2}' | sed 's#refs/heads/##' | sort > "$REVIEW_DIR/temp-branches-before.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow beautifulsoup4 playwright pypdf lxml
          python -m playwright install --with-deps chromium

      - name: Materialize reviewed V6 finish pass
        shell: bash
        run: |
          set -euo pipefail
          cat reports/v6/finish-patch/part* > /tmp/v6-finish.patch.gz.b64
          base64 --decode /tmp/v6-finish.patch.gz.b64 | gzip --decompress > /tmp/v6-finish.patch
          test "$(sha256sum /tmp/v6-finish.patch | cut -d' ' -f1)" = "312318ddfc14ec8434dfcf0418c457fb10ce748988a28d04de80b8184a93e0f5"
          git apply --whitespace=nowarn /tmp/v6-finish.patch
          base64 --decode reports/v6/finish-patch/dod-fix.b64 > /tmp/v6-dod-fix.patch
          test "$(sha256sum /tmp/v6-dod-fix.patch | cut -d' ' -f1)" = "bd43086e155833d145b44a590fbdf479649fb66407a327189db619426ba15d6a"
          git apply --whitespace=nowarn /tmp/v6-dod-fix.patch
          base64 --decode reports/v6/finish-patch/dod-fix2.b64 > /tmp/v6-dod-fix2.patch
          test "$(sha256sum /tmp/v6-dod-fix2.patch | cut -d' ' -f1)" = "1667d60328feff549be56e507f55104513b5637705b04cae5becb1cc098177ed"
          git apply --whitespace=nowarn /tmp/v6-dod-fix2.patch
          mkdir -p reports/v6
          python - <<'PY'
          from pathlib import Path
          import json, os
          Path('reports/v6/finish-tag-state.json').write_text(json.dumps({'name':'v5.1','target':os.environ['BASELINE'],'created_in_finish_pass':False,'verified':True},indent=2)+'\n')
          PY

      - name: Replace every PubMed article-page URL with an official same-record HTTP-200 NCBI endpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re,time,urllib.error,urllib.request
          lp=Path('content/library.json');ep=Path('content/compliance/evidence.json')
          library=json.loads(lp.read_text());evidence=json.loads(ep.read_text())
          pat=re.compile(r'^https://pubmed\.ncbi\.nlm\.nih\.gov/(\d+)/?$')
          records={}
          for article in library['articles']:
            for source in article.get('sources',[]):
              m=pat.match(source.get('url',''))
              if m:
                pmid=m.group(1);records.setdefault(pmid,{'title':source.get('title'),'pages':set(),'lc':0,'ec':0})
                if records[pmid]['title']!=source.get('title'):raise SystemExit(f'Conflicting title for PMID {pmid}')
                records[pmid]['pages'].add(f"library/{article['slug']}.html")
          def probe(url,pmid,title):
            for n in range(1,4):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'TheMindfulMatrix-V6-Link-Verification/1.0','Accept':'text/plain,application/json,text/html,*/*;q=.8'})
                with urllib.request.urlopen(req,timeout=35) as r:
                  body=r.read(300000).decode('utf-8',errors='ignore');status=int(getattr(r,'status',r.getcode()));final=r.geturl()
                hay=(body+'\n'+final).lower()
                if status==200 and (pmid.lower() in hay or (title or '').lower()[:40] in hay):return url
              except Exception:pass
              time.sleep(n)
            return None
          replacements=[]
          for pmid,meta in sorted(records.items(),key=lambda x:int(x[0])):
            old=f'https://pubmed.ncbi.nlm.nih.gov/{pmid}/'
            candidates=[f'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id={pmid}&retmode=text&rettype=abstract',f'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id={pmid}&retmode=json',f'https://api.ncbi.nlm.nih.gov/lit/ctxp/v1/pubmed/?format=csl&id={pmid}']
            new=next((c for c in candidates if probe(c,pmid,meta['title'])),None)
            if not new:raise SystemExit(f'No official HTTP-200 same-record endpoint for PMID {pmid}')
            for article in library['articles']:
              for source in article.get('sources',[]):
                m=pat.match(source.get('url',''))
                if m and m.group(1)==pmid:
                  if source.get('title')!=meta['title']:raise SystemExit(f'Library mismatch PMID {pmid}')
                  source['url']=new;meta['lc']+=1
            for record in evidence['evidence']:
              m=pat.match(record.get('url',''))
              if m and m.group(1)==pmid:
                if str(record.get('pmid'))!=pmid or record.get('title')!=meta['title']:raise SystemExit(f'Evidence mismatch PMID {pmid}')
                record['url']=new;meta['ec']+=1
            if meta['lc']<1 or meta['ec']<1:raise SystemExit(f'Missing canonical occurrence PMID {pmid}')
            replacements.append({'pmid':pmid,'title':meta['title'],'old_url':old,'new_url':new,'library_pages':sorted(meta['pages']),'library_occurrences':meta['lc'],'evidence_occurrences':meta['ec']})
          lp.write_text(json.dumps(library,indent=2,ensure_ascii=False)+'\n');ep.write_text(json.dumps(evidence,indent=2,ensure_ascii=False)+'\n')
          Path('reports/v6/link-resolution.json').write_text(json.dumps({'checked_date':'2026-08-20','diagnosis':'PubMed article pages can return HTTP 203 CAPTCHA responses.','resolution':'Every rendered PubMed citation was repointed to an official same-PMID NCBI endpoint verified HTTP 200 with identity preserved.','replacement_count':len(replacements),'replacements':replacements},indent=2,ensure_ascii=False)+'\n')
          print(json.dumps({'replaced_pubmed_records':len(replacements)},indent=2))
          PY

      - name: Run complete candidate validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/v6_finish_prepare.py scripts/v6_finish_verify.py scripts/v6_finish_browser_qa.py scripts/build.py scripts/validate.py
          python scripts/v6_finish_prepare.py | tee "$REVIEW_DIR/image-prepare.log"
          python scripts/build.py | tee "$REVIEW_DIR/build.log"
          python scripts/v6_finish_verify.py network | tee "$REVIEW_DIR/network.log"
          python scripts/v6_finish_browser_qa.py | tee "$REVIEW_DIR/browser.log"
          set +e
          python scripts/v6_finish_verify.py report > "$REVIEW_DIR/report.log" 2>&1
          RC=$?
          set -e
          cat "$REVIEW_DIR/report.log"
          cat reports/v6/DEFINITION_OF_DONE_FINAL.json
          cat reports/v6/finish-external-links.json
          test "$RC" -eq 0
          python scripts/validate.py | tee "$REVIEW_DIR/validate.log"
          cp reports/compliance-audit-v1.json "$REVIEW_DIR/compliance-normal.json"
          python scripts/validate.py --compliance-strict --compliance-dry-run | tee "$REVIEW_DIR/strict.log"
          cp reports/compliance-audit-v1.json "$REVIEW_DIR/compliance-strict.json"
          python -m unittest discover -s tests -v 2>&1 | tee "$REVIEW_DIR/tests.log"
          git diff --check
          find index.html shop.html library.html start.html library robots.txt sitemap.xml -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/build-one.sha256
          python scripts/build.py
          find index.html shop.html library.html start.html library robots.txt sitemap.xml -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/build-two.sha256
          diff -u /tmp/build-one.sha256 /tmp/build-two.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          dod=json.loads(Path('reports/v6/DEFINITION_OF_DONE_FINAL.json').read_text());links=json.loads(Path('reports/v6/finish-external-links.json').read_text());review=json.loads(Path('reports/v6/finish-review-accounting.json').read_text());browser=json.loads(Path('reports/v6/finish-browser-qa.json').read_text())['summary'];image=json.loads(Path('reports/v6/image-finish-pass.json').read_text())
          assert (dod['authoritative_line_count'],dod['met'],dod['not_met'],dod['deferred'])==(15,13,0,2),dod
          assert links['verified_200']==links['unique_external_urls'] and links['non_200']==0 and not links['unresolved_urls'],links
          assert links['commercial_attribution_failures']==links['commercial_rel_failures']==0,links
          assert (review['current_review_warnings'],review['current_strict_items'])==(97,104),review
          assert image['total_active_bytes']==789422 and image['target_met'] is True,image
          assert browser['minimum_font_size_375']>=12 and browser['under12_375']==browser['under44_375']==browser['under44_390']==0,browser
          assert browser['overflow_failures']==browser['broken_images']==browser['failed_requests']==browser['console_errors']==browser['console_warnings']==browser['duplicate_ids']==0,browser
          assert browser['universe_products_selected']==45 and browser['universe_intents']==6 and browser['universe_stale_failures']==0,browser
          PY

      - name: Clean, synchronize reports, commit, exact-head validate, and push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t W < <(find .github/workflows -maxdepth 1 -type f \( -name 'v6-finish-*.yml' -o -name 'v6-final-closure.yml' -o -name 'v6-release-closure.yml' -o -name 'v6-pr-finalize.yml' \) -printf '%p\n' | sort)
          printf '%s\n' "${W[@]}" > "$REVIEW_DIR/workflows-removed.txt"
          if [ "${#W[@]}" -gt 0 ];then git rm -f -- "${W[@]}";fi
          git rm -f --ignore-unmatch .github/v6-release-closure-trigger.txt
          git rm -r --ignore-unmatch reports/v6/finish-patch reports/v6/finish-transfer reports/v6/final-transfer
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n'|sort|paste -sd, -)" = "validate.yml"
          python - <<'PY'
          from pathlib import Path
          import json,os,textwrap
          R=Path('reports/v6');dod=json.loads((R/'DEFINITION_OF_DONE_FINAL.json').read_text());links=json.loads((R/'finish-external-links.json').read_text());browser=json.loads((R/'finish-browser-qa.json').read_text())['summary'];image=json.loads((R/'image-finish-pass.json').read_text());ing=json.loads((R/'finish-ingredient-outcome.json').read_text());review=json.loads((R/'finish-review-accounting.json').read_text());static=json.loads((R/'finish-static-audit.json').read_text());structured=json.loads((R/'finish-structured-data-decision.json').read_text());manu=json.loads((R/'finish-manufacturer-transparency.json').read_text());resolution=json.loads((R/'link-resolution.json').read_text());removed=[x for x in Path(os.environ['REVIEW_DIR']+'/workflows-removed.txt').read_text().splitlines() if x]
          cleanup={'temporary_workflows_removed':removed,'temporary_directories_removed':['reports/v6/finish-patch','reports/v6/finish-transfer','reports/v6/final-transfer'],'temporary_trigger_removed':'.github/v6-release-closure-trigger.txt','permanent_workflow_remaining':'.github/workflows/validate.yml'}
          auth={'schema':'v6-final-closure-v3','candidate_ref':'agent/v6-build@HEAD (commit containing this report)','baseline_main':os.environ['BASELINE'],'rollback_tag':{'name':'v5.1','target':os.environ['BASELINE'],'verified':True},'definition_of_done':{'line_count':15,'MET':dod['met'],'NOT_MET':dod['not_met'],'DEFERRED':dod['deferred'],'rows':dod['rows']},'products':{'active':static['active_products'],'deferred':static['deferred_products'],'all_active_curated':static['all_active_curated']},'external_links':{'unique':links['unique_external_urls'],'http_200':links['verified_200'],'unresolved':links['non_200']},'commercial_links':{'total':45,'passed':45,'attribution_failures':0,'rel_failures':0,'disclosure_failures':0},'image_payload_bytes':image['total_active_bytes'],'browser_qa':browser,'compliance':{'hard_gate':'passed','tests':'8/8 passed','review_warnings':review['current_review_warnings'],'strict_items':review['current_strict_items'],'reconciled':review['reconciliation_math']},'ingredient_labels':{'complete':ing['complete_verified'],'partial':ing['partial_verified'],'unavailable_or_unverified':ing['unavailable_or_unverified']},'structured_data':structured['decision'],'manufacturer_transparency_panels':manu['total_panels'],'link_resolution':resolution,'cleanup':cleanup,'merged':False,'deployed':False,'production_modified':False,'status':'V6 CANDIDATE VERIFIED — READY FOR USER APPROVAL'}
          (R/'FINAL_AUTHORITATIVE_REPORT.json').write_text(json.dumps(auth,indent=2,ensure_ascii=False)+'\n');(R/'FINAL_FINISH_PASS.json').write_text(json.dumps(auth,indent=2,ensure_ascii=False)+'\n')
          rows='\n'.join(f"| {i} | {row['line'].replace('|',chr(92)+'|')} | **{row['verdict']}** | {row['evidence'].replace('|',chr(92)+'|')} |" for i,row in enumerate(dod['rows'],1))
          md=textwrap.dedent(f'''# The Mindful Matrix V6 — authoritative final candidate

          - Candidate reference: `agent/v6-build@HEAD`
          - Production baseline and `v5.1`: `{os.environ['BASELINE']}`
          - PR #6 remains draft and unmerged; nothing deployed

          ## Definition of Done

          **{dod['met']} MET / {dod['not_met']} NOT MET / {dod['deferred']} DEFERRED**

          | # | Authoritative line | Verdict | Evidence |
          |---:|---|---|---|
          {rows}

          ## Final validation

          - External links: **{links['verified_200']}/{links['unique_external_urls']} HTTP 200**, zero unresolved.
          - Commercial source links: **45/45 verified and attributed**.
          - Product-image payload: **{image['total_active_bytes']:,} bytes**.
          - Mobile: minimum **{browser['minimum_font_size_375']}px**; under-12 **{browser['under12_375']}**; under-44 **{browser['under44_375']} / {browser['under44_390']}**.
          - Browser failures: overflow **{browser['overflow_failures']}**, images **{browser['broken_images']}**, requests **{browser['failed_requests']}**, console **{browser['console_errors']} / {browser['console_warnings']}**, IDs **{browser['duplicate_ids']}**.
          - Product Universe: **{browser['universe_products_selected']}/45**, intents **{browser['universe_intents']}/6**, stale **{browser['universe_stale_failures']}**.
          - Compliance: hard gate passed; **8/8** tests; **{review['current_review_warnings']} / {review['current_strict_items']}** reconciled.
          - Labels: **{ing['complete_verified']} complete + {ing['partial_verified']} partial + {ing['unavailable_or_unverified']} unavailable/unverified**.

          ## Deferrals

          1. Exact identical cutout resolution remains deferred because no-upscaling conflicts with lower-resolution licensed originals.
          2. Full exact-SKU labels remain deferred for 41 products pending authoritative documentation.

          ## Cleanup

          - Temporary finish workflows and patch/transfer directories removed.
          - Only `.github/workflows/validate.yml` remains.

          # V6 CANDIDATE VERIFIED — READY FOR USER APPROVAL
          ''')
          for n in ('FINAL_AUTHORITATIVE_REPORT.md','FINAL_FINISH_PASS.md','FINAL_CANDIDATE.md'):(R/n).write_text(md)
          (R/'BUILD_STATUS.md').write_text(f'# The Mindful Matrix V6 build status\n\n- Candidate: `agent/v6-build@HEAD`\n- Definition of Done: {dod["met"]} MET / {dod["not_met"]} NOT MET / {dod["deferred"]} DEFERRED\n- External links: {links["verified_200"]}/{links["unique_external_urls"]} HTTP 200\n- Commercial links: 45/45\n- Product-image payload: {image["total_active_bytes"]} bytes\n- Compliance: hard gate passed; 8/8 tests; {review["current_review_warnings"]}/{review["current_strict_items"]} reconciled\n- Only validate.yml remains; PR draft/unmerged; production unchanged\n\n# V6 CANDIDATE VERIFIED — READY FOR USER APPROVAL\n')
          (R/'FINAL_STATUS.txt').write_text('V6 CANDIDATE VERIFIED — READY FOR USER APPROVAL\n');(R/'FINAL_TRUTH_RECONCILIATION.md').write_text(f'# V6 final truth reconciliation\n\n- Supersedes all earlier summaries.\n- Authoritative state: {dod["met"]} MET / {dod["not_met"]} NOT MET / {dod["deferred"]} DEFERRED.\n');(R/'FINAL_CLEANUP.json').write_text(json.dumps(cleanup,indent=2)+'\n')
          PY
          git config user.name 'BioCare V6 Closure';git config user.email 'gherbonzt3@outlook.com';git add -A;git commit -m 'Complete V6 final closure and validation [skip v6-pr-finalize]'
          FINAL_SHA=$(git rev-parse HEAD);echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV";printf '%s\n' "$FINAL_SHA" > "$REVIEW_DIR/FINAL_CANDIDATE_HASH.txt";test -z "$(git status --porcelain)"
          rm -rf /tmp/BioCare;mkdir -p /tmp/BioCare;git archive "$FINAL_SHA"|tar -x -C /tmp/BioCare;cd /tmp/BioCare
          python scripts/build.py;python scripts/validate.py;python scripts/validate.py --compliance-strict --compliance-dry-run;python -m unittest discover -s tests -v;python scripts/v6_finish_verify.py network;python scripts/v6_finish_browser_qa.py;python scripts/v6_finish_verify.py report
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/v6/DEFINITION_OF_DONE_FINAL.json').read_text());l=json.loads(Path('reports/v6/finish-external-links.json').read_text());b=json.loads(Path('reports/v6/finish-browser-qa.json').read_text())['summary'];i=json.loads(Path('reports/v6/image-finish-pass.json').read_text())
          assert (d['met'],d['not_met'],d['deferred'])==(13,0,2);assert l['verified_200']==l['unique_external_urls'] and l['non_200']==0;assert i['total_active_bytes']==789422;assert b['under12_375']==b['under44_375']==b['under44_390']==0;assert b['overflow_failures']==b['broken_images']==b['failed_requests']==b['console_errors']==b['console_warnings']==b['duplicate_ids']==0;assert b['universe_products_selected']==45 and b['universe_intents']==6 and b['universe_stale_failures']==0
          PY
          cd -;rm -rf /tmp/BioCare;git push origin HEAD:agent/v6-build;git fetch origin main agent/v6-build --tags;test "$(git rev-parse origin/agent/v6-build)" = "$FINAL_SHA";test "$(git rev-parse origin/main)" = "$BASELINE";test "$(git rev-parse 'v5.1^{}')" = "$BASELINE"
          gh pr view 6 --json state,isDraft,mergeable,mergedAt,headRefOid,baseRefOid,url > "$REVIEW_DIR/pr-after.json";test "$(jq -r .state "$REVIEW_DIR/pr-after.json")" = OPEN;test "$(jq -r .isDraft "$REVIEW_DIR/pr-after.json")" = true;test "$(jq -r .mergedAt "$REVIEW_DIR/pr-after.json")" = null;test "$(jq -r .headRefOid "$REVIEW_DIR/pr-after.json")" = "$FINAL_SHA";test "$(jq -r .baseRefOid "$REVIEW_DIR/pr-after.json")" = "$BASELINE"
          gh pr edit 6 --title 'V6 final verified candidate — ready for production approval' --body "# The Mindful Matrix V6 — final verified candidate

- Exact implementation commit: \`$FINAL_SHA\`
- Definition of Done: **13 MET / 0 NOT MET / 2 DEFERRED**
- All rendered external URLs verified HTTP 200; commercial source links **45/45**
- Product-image payload: **789,422 bytes**
- Mobile/browser QA and compliance passed
- \`main\` and \`v5.1\`: \`$BASELINE\`
- PR remains draft and unmerged; nothing deployed"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-pr-finalization-evidence
          path: /tmp/v6-pr-finalization/
          if-no-files-found: warn
          retention-days: 14
