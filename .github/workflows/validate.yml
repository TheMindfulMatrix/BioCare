name: Validate static site

on:
  pull_request:
  push:
    branches: [main, agent/v6-build, agent/v7-product-first]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate site
        run: python scripts/build.py
      - name: Verify committed output and site structure
        run: |
          git diff --exit-code -- index.html explore.html evidence.html shop.html library.html start.html know-your-number.html departments/ library/ products/ assets/data/search-index.json robots.txt sitemap.xml
          python scripts/validate.py
          python scripts/scan_v10_public_safety.py
      - name: Run compliance fixtures
        run: python -m unittest discover -s tests -v
      - name: Report strict compliance backlog
        run: python scripts/validate.py --compliance-strict --compliance-dry-run
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: biocare-static-preview
          path: |
            index.html
            explore.html
            evidence.html
            shop.html
            library.html
            start.html
            know-your-number.html
            robots.txt
            sitemap.xml
            departments/
            library/
            assets/
            content/resources/public-sources.json
            reports/v10/
            img/
