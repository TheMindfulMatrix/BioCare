name: Validate static site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate site
        run: python scripts/build.py
      - name: Verify committed output and site structure
        run: |
          git diff --exit-code -- index.html library.html start.html library/
          python scripts/validate.py
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: biocare-static-preview
          path: |
            index.html
            library.html
            start.html
            library/
            assets/
            img/
