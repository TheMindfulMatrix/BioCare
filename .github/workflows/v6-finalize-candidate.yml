name: V6 final candidate integration

on:
  push:
    branches: [agent/v6-build]

permissions:
  contents: write

env:
  V6_REVIEW_DIR: /tmp/v6-review

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip v6-finalize]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install candidate QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow beautifulsoup4 playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Prepare approved imagery, verified data, policy holds, and network audit
        run: python scripts/v6_finalize_candidate.py prepare
      - name: Run rendered desktop, tablet, mobile, accessibility, and browser commerce QA
        run: python scripts/v6_browser_qa.py
      - name: Consolidate browser commerce findings and rebuild
        run: python scripts/v6_finalize_candidate.py consolidate
      - name: Analyze compliance-warning delta
        shell: bash
        run: |
          python scripts/validate.py > /tmp/v6-validation.log 2>&1
          python scripts/validate.py --compliance-strict --compliance-dry-run > /tmp/v6-strict.log 2>&1
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          root=Path('.')
          current=(root/'reports/compliance-audit-v1.json')
          current_data=json.loads(current.read_text(encoding='utf-8')) if current.exists() else {}
          baseline_raw=subprocess.run(['git','show','b5d35772e98580e253c08f6319aa8e412fa20aea:reports/compliance-audit-v1.json'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True).stdout
          baseline_data=json.loads(baseline_raw) if baseline_raw.strip() else {}
          def flatten(obj):
              if isinstance(obj,dict):
                  for key in ('warnings','reviewItems','review_items','items','findings'):
                      if isinstance(obj.get(key),list): return obj[key]
              return []
          def key(item):
              if not isinstance(item,dict): return str(item)
              return '|'.join(str(item.get(k,'')) for k in ('path','jsonPath','code','rule','message','text'))
          before={key(i):i for i in flatten(baseline_data)}
          after={key(i):i for i in flatten(current_data)}
          added=[after[k] for k in sorted(after.keys()-before.keys())]
          classes={'catalog_scope':0,'accessibility_or_alt':0,'generated_copy':0,'metadata':0,'other':0}
          for item in added:
              text=json.dumps(item,ensure_ascii=False).lower()
              if 'catalog.json' in text: classes['catalog_scope']+=1
              elif any(x in text for x in ('aria','alt','accessible','opens in a new tab')): classes['accessibility_or_alt']+=1
              elif any(x in text for x in ('index.html','shop.html','library/')): classes['generated_copy']+=1
              elif any(x in text for x in ('metadata','og:','twitter')): classes['metadata']+=1
              else: classes['other']+=1
          validation=Path('/tmp/v6-validation.log').read_text(errors='ignore')
          strict=Path('/tmp/v6-strict.log').read_text(errors='ignore')
          warn_match=re.search(r'with (\d+) review warning',validation)
          strict_match=re.search(r'would fail with (\d+) unresolved',strict)
          report={'baseline_review_warnings':77,'baseline_strict_items':84,'current_review_warnings':int(warn_match.group(1)) if warn_match else None,'current_strict_items':int(strict_match.group(1)) if strict_match else None,'new_items_detected_from_audit_json':len(added),'classification':classes,'new_items':added,'principle':'Do not remove useful accessibility or factual text merely to lower a scanner count.'}
          out=root/'reports/v6/compliance-warning-delta.json'; out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          (root/'reports/v6/compliance-warning-delta.md').write_text('# V6 compliance warning delta\n\n'+f"- V5.1 review warnings: 77\n- V6 review warnings: {report['current_review_warnings']}\n- V5.1 strict items: 84\n- V6 strict items: {report['current_strict_items']}\n- Newly identified items in audit JSON comparison: {len(added)}\n\n## Classification\n\n"+'\n'.join(f"- {k.replace('_',' ').title()}: {v}" for k,v in classes.items())+'\n\nNo hard-rule violation was suppressed. Accessibility labels are retained unless a context-aware scanner change is justified.\n',encoding='utf-8')
          PY
      - name: Final deterministic build and release gates
        run: |
          python scripts/build.py
          git diff --check
          python scripts/validate.py
          python scripts/validate.py --compliance-strict --compliance-dry-run
          python -m unittest discover -s tests -v
          python scripts/build.py
          git diff --check
      - name: Upload final V6 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-final-review-evidence
          path: |
            /tmp/v6-review/
            reports/v6/*.json
            reports/v6/*.md
          if-no-files-found: warn
          retention-days: 7
      - name: Commit validated candidate checkpoint
        run: |
          git config user.name "BioCare V6 Builder"
          git config user.email "gherbonzt3@outlook.com"
          git add \
            assets/product-cutouts/zinzino-v6/ \
            content/catalog.json content/product-labels.json content/manufacturer-documents.json \
            index.html shop.html library.html start.html library/ robots.txt sitemap.xml \
            reports/v6/ scripts/v6_finalize_candidate.py scripts/v6_browser_qa.py
          if git diff --cached --quiet; then
            echo "No candidate changes required."
            exit 0
          fi
          git commit -m "v6: finalize approved imagery, data gates, and commerce verification [skip v6-finalize]"
          git push origin HEAD:agent/v6-build
