name: V6 finish-pass source snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    if: ${{ github.head_ref == 'agent/v6-build' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-build
          fetch-depth: 0
      - name: Verify starting state
        run: |
          test "$(git rev-parse origin/main)" = "b5d35772e98580e253c08f6319aa8e412fa20aea"
          test "$(git merge-base origin/main HEAD)" = "b5d35772e98580e253c08f6319aa8e412fa20aea"
          git status --short
      - name: Package source
        run: |
          mkdir -p /tmp/v6-source
          rsync -a --exclude='.git/' --exclude='.github/workflows/v6-finish-snapshot.yml' ./ /tmp/v6-source/BioCare/
          git log --oneline --decorate --graph --all -100 > /tmp/v6-source/branch-history.txt
          git tag --list --format='%(refname:short) %(objectname)' > /tmp/v6-source/tags.txt
          git grep -n -E '(^|[^0-9])(35|45)([^0-9]|$)' -- '*.html' '*.py' '*.js' '*.json' '*.md' '*.yml' '*.bat' > /tmp/v6-source/product-count-literals.txt || true
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: v6-finish-source
          path: /tmp/v6-source/
          retention-days: 2
