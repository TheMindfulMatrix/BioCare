name: V6 finish-pass diagnostic

on:
  push:
    branches: [agent/v6-build]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow beautifulsoup4
      - name: Run source patch and image preparation with captured output
        shell: bash
        run: |
          set +e
          cat reports/v6/finish-transfer/part00 reports/v6/finish-transfer/part01 reports/v6/finish-transfer/part02 reports/v6/finish-transfer/part03 > scripts/v6_finish_patch.py
          python -m py_compile scripts/v6_finish_patch.py scripts/v6_finish_prepare.py scripts/v6_finish_browser_qa.py scripts/v6_finish_verify.py > /tmp/compile.log 2>&1
          echo $? > /tmp/compile.rc
          python scripts/v6_finish_patch.py > /tmp/patch.log 2>&1
          echo $? > /tmp/patch.rc
          python scripts/v6_finish_prepare.py > /tmp/prepare.log 2>&1
          echo $? > /tmp/prepare.rc
          python scripts/build.py > /tmp/build.log 2>&1
          echo $? > /tmp/build.rc
          python scripts/validate.py > /tmp/validate.log 2>&1
          echo $? > /tmp/validate.rc
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: v6-finish-diagnostic
          path: |
            /tmp/*.log
            /tmp/*.rc
            reports/v6/image-finish-pass.json
            content/catalog.json
            scripts/v6_finish_patch.py
          if-no-files-found: warn
          retention-days: 1
