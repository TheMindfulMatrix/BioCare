name: V6 authoritative final finish pass

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  V6_REVIEW_DIR: /tmp/v6-finish-review
  BASELINE: b5d35772e98580e253c08f6319aa8e412fa20aea
  PREVIOUS: 351746b8e9e5195255840758cc4639019e16023d

jobs:
  finish:
    if: ${{ github.head_ref == 'agent/v6-build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-build
          fetch-depth: 0

      - name: Verify protected starting state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$BASELINE"
          test "$(git merge-base origin/main HEAD)" = "$BASELINE"
          git merge-base --is-ancestor "$PREVIOUS" HEAD
          test -z "$(git status --porcelain)"
          test "$(gh pr view 6 --json isDraft -q .isDraft)" = "true"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install finish-pass QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow beautifulsoup4 playwright pypdf lxml
          python -m playwright install --with-deps chromium

      - name: Apply reviewed finish-pass source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          data='''...'''
          patch = gzip.decompress(base64.b64decode(data))
          Path('/tmp/v6-finish.patch').write_bytes(patch)
          PY
          test "$(sha256sum /tmp/v6-finish.patch | cut -d' ' -f1)" = "fabfc4fa7b3c4d1791a9f085ac9209115cf63a905753d356e849cc896cff0850"
          git apply --whitespace=nowarn /tmp/v6-finish.patch
          python -m py_compile scripts/v6_finish_prepare.py scripts/v6_finish_verify.py scripts/build.py scripts/validate.py

      - name: Create and verify V5.1 rollback tag
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v5.1 >/dev/null; then
            test "$(git rev-parse 'v5.1^{}')" = "$BASELINE"
            created=false
          else
            git tag -a v5.1 "$BASELINE" -m "The Mindful Matrix V5.1 rollback baseline"
            git push origin refs/tags/v5.1
            created=true
          fi
          mkdir -p reports/v6
          python - <<PY
          import json
          from pathlib import Path
          Path('reports/v6/finish-tag-state.json').write_text(json.dumps({'name':'v5.1','target':'$BASELINE','created_in_finish_pass':$created,'verified':True},indent=2)+'\n')
          PY
          git push origin --delete agent/v6-finish-safety || true

      - name: Generate optimized assets and candidate
        run: |
          python scripts/v6_finish_prepare.py
          python scripts/build.py

      - name: Verify network and crawler behavior
        run: python scripts/v6_finish_verify.py network

      - name: Render full pages and exercise interactions
        run: python scripts/v6_finish_browser_qa.py

      - name: Produce final evidence and Definition-of-Done audit
        run: python scripts/v6_finish_verify.py report

      - name: Full permanent-equivalent regression gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build.py
          python scripts/validate.py | tee /tmp/v6-finish-validate.log
          python scripts/validate.py --compliance-strict --compliance-dry-run | tee /tmp/v6-finish-strict.log
          python -m unittest discover -s tests -v
          git diff --check
          python scripts/build.py
          git diff --check
          grep -qx 'V6 CANDIDATE READY FOR FINAL USER REVIEW' reports/v6/FINAL_STATUS.txt

      - name: Remove temporary execution materials
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/v6-finish-run.yml .github/workflows/v6-finish-snapshot.yml
          git rm -r --ignore-unmatch reports/v6/finish-transfer
          rm -rf __pycache__ scripts/__pycache__ tests/__pycache__

      - name: Upload final finish-pass evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-authoritative-finish-review
          path: |
            /tmp/v6-finish-review/
            reports/v6/*.json
            reports/v6/*.md
            reports/v6/FINAL_STATUS.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Commit new V6 candidate and keep PR draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "BioCare V6 Finish Builder"
          git config user.email "gherbonzt3@outlook.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "v6: complete authoritative final finish pass [skip finish-snapshot]"
          git push origin HEAD:agent/v6-build
          test "$(gh pr view 6 --json isDraft -q .isDraft)" = "true"
          gh pr edit 6 --title "V6 final finish-pass candidate — ready for user review" --body-file reports/v6/FINAL_FINISH_PASS.md
