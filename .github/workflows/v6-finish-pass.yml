name: V6 final finish pass

on:
  push:
    branches: [agent/v6-build]

permissions:
  contents: write
  pull-requests: write

env:
  V6_REVIEW_DIR: /tmp/v6-finish-review
  BASELINE: b5d35772e98580e253c08f6319aa8e412fa20aea

jobs:
  finish:
    if: ${{ !contains(github.event.head_commit.message, '[skip v6-finish-pass]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v6-build
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify protected starting state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$BASELINE"
          test "$(git branch --show-current)" = "agent/v6-build"
          git diff --quiet
          git diff --cached --quiet
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          expected='351746b8e9e5195255840758cc4639019e16023d'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          Path('reports/v6').mkdir(parents=True,exist_ok=True)
          Path('reports/v6/finish-start-state.json').write_text(json.dumps({
            'expected_previous_candidate': expected,
            'actual_finish_start_head': head,
            'production_main': subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip(),
            'branch':'agent/v6-build',
            'note':'The finish pass began after evidence/cleanup commits beyond the previous candidate; all ancestry remains fast-forward from the same V5.1 merge base.'
          },indent=2)+'\n')
          PY
      - name: Install finish-pass dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow beautifulsoup4 playwright pypdf lxml
          python -m playwright install --with-deps chromium
      - name: Assemble and syntax-check finish tooling
        shell: bash
        run: |
          cat reports/v6/finish-transfer/part00 reports/v6/finish-transfer/part01 reports/v6/finish-transfer/part02 reports/v6/finish-transfer/part03 > scripts/v6_finish_patch.py
          chmod +x scripts/v6_finish_patch.py scripts/v6_finish_prepare.py scripts/v6_finish_browser_qa.py scripts/v6_finish_verify.py
          python -m py_compile scripts/v6_finish_patch.py scripts/v6_finish_prepare.py scripts/v6_finish_browser_qa.py scripts/v6_finish_verify.py
      - name: Create or verify the V5.1 rollback tag
        shell: bash
        run: |
          set -euo pipefail
          existing="$(git rev-list -n 1 v5.1 2>/dev/null || true)"
          if [ -n "$existing" ] && [ "$existing" != "$BASELINE" ]; then
            echo "Existing v5.1 tag resolves to $existing, expected $BASELINE" >&2
            exit 1
          fi
          if [ -z "$existing" ]; then
            git config user.name "BioCare V6 Builder"
            git config user.email "gherbonzt3@outlook.com"
            git tag -a v5.1 "$BASELINE" -m "The Mindful Matrix V5.1 production rollback baseline"
            git push origin refs/tags/v5.1
          fi
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          target=subprocess.check_output(['git','rev-list','-n','1','v5.1'],text=True).strip()
          Path('reports/v6/finish-tag-state.json').write_text(json.dumps({'name':'v5.1','target':target,'verified':target=='b5d35772e98580e253c08f6319aa8e412fa20aea'},indent=2)+'\n')
          PY
      - name: Apply approved finish-pass source changes
        run: python scripts/v6_finish_patch.py
      - name: Optimize product imagery and hero
        run: |
          python scripts/v6_finish_prepare.py
          python scripts/build.py
      - name: Verify every external URL and predeployment social transport
        run: python scripts/v6_finish_verify.py network
      - name: Run full rendered finish-pass QA
        run: python scripts/v6_finish_browser_qa.py
      - name: Consolidate evidence and Definition of Done
        run: python scripts/v6_finish_verify.py report
      - name: Run complete permanent validation gates
        shell: bash
        run: |
          set -o pipefail
          python scripts/build.py
          python scripts/validate.py | tee /tmp/v6-finish-validate.log
          python scripts/validate.py --compliance-strict --compliance-dry-run | tee /tmp/v6-finish-strict.log
          python -m unittest discover -s tests -v
          git diff --check
          python scripts/build.py
          git diff --check
          grep -Fx 'V6 CANDIDATE READY FOR FINAL USER REVIEW' reports/v6/FINAL_STATUS.txt
      - name: Upload complete finish-pass evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-final-finish-pass-review
          path: |
            /tmp/v6-finish-review/
            reports/v6/*.json
            reports/v6/*.md
            reports/v6/FINAL_STATUS.txt
            reports/v6/finish-tag-state.json
            /tmp/v6-finish-validate.log
            /tmp/v6-finish-strict.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit the final finish-pass candidate and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v6-finish-pass.yml
          rm -rf reports/v6/finish-transfer
          rm -f scripts/v6_finish_patch.py
          git config user.name "BioCare V6 Builder"
          git config user.email "gherbonzt3@outlook.com"
          git add -A
          git diff --cached --check
          git commit -m "v6: complete final finish pass for user review [skip v6-finish-pass]"
          git push origin HEAD:agent/v6-build
      - name: Update the existing draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '# The Mindful Matrix V6 — final finish-pass candidate'
            echo
            cat reports/v6/FINAL_FINISH_PASS.md
            echo
            echo '## Safety'
            echo
            echo '- PR remains DRAFT and unmerged.'
            echo '- `main` and production remain on V5.1.'
            echo '- A separate user-approved release command is required.'
          } > /tmp/v6-finish-pr.md
          gh pr edit 6 --title "V6 final finish-pass candidate — ready for user review" --body-file /tmp/v6-finish-pr.md
